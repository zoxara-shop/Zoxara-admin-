<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoxara Admin Portal</title>
    <style>
        body { font-family: sans-serif; background: #111; color: #fff; padding: 15px; margin: 0; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; }
        .box { background: #1c1c1e; padding: 20px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); margin-top: 15px; }
        h2 { margin-bottom: 15px; font-size: 18px; text-align: center; color: #fff; }
        label { font-size: 11px; color: #aaa; display: block; margin-top: 10px; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #333; background: #2c2c2e; color: #fff; border-radius: 8px; font-size: 12px; box-sizing: border-box; outline: none; }
        button { width: 100%; background: #fff; color: #000; border: none; padding: 12px; margin-top: 15px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        button:hover { background: #ddd; }
        .hidden { display: none; }
        .error { color: #ff4757; font-size: 11px; text-align: center; margin-top: 10px; }

        .home-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
        .card-btn { background: #2c2c2e; border: 1px solid #333; padding: 20px 10px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .card-btn:hover { background: #3a3a3c; border-color: #555; transform: translateY(-2px); }
        .card-icon { font-size: 22px; margin-bottom: 8px; }
        .card-title { font-size: 12px; font-weight: bold; }

        .back-home { background: #333; color: #fff; margin-bottom: 15px; padding: 8px; font-size: 11px; width: auto; display: inline-block; }
        .back-home:hover { background: #444; }

        .product-item { display: flex; justify-content: space-between; align-items: center; background: #2c2c2e; padding: 10px; border-radius: 8px; margin-bottom: 8px; font-size: 12px; gap: 8px; }
        .product-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
        .delete-btn { background: #ff4757; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; width: auto; margin-top: 0; }
        .edit-btn { background: #3498db; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; font-weight: bold; width: auto; margin-top: 0; }
    </style>
</head>
<body>

    <div class="container">
        <!-- Login Screen -->
        <div class="box" id="loginBox">
            <h2>Admin Login</h2>
            <form onsubmit="handleLogin(event)">
                <label>Name</label>
                <input type="text" id="adminUser" required placeholder="Enter name">

                <label>Password</label>
                <input type="password" id="adminPass" required placeholder="Enter password">

                <button type="submit">Login</button>
                <div class="error" id="errorMsg"></div>
            </form>
        </div>

        <!-- Home Dashboard -->
        <div class="box hidden" id="homePage">
            <h2>Zoxara Admin Dashboard</h2>
            <p style="font-size: 11px; color: #aaa; text-align: center; margin-top: -10px; margin-bottom: 15px;">Cloud Synced Control Panel</p>
            
            <div class="home-grid">
                <div class="card-btn" onclick="openSection('addTab')">
                    <span class="card-icon">➕</span>
                    <span class="card-title">Add Product</span>
                </div>
                <div class="card-btn" onclick="openSection('deleteTab')">
                    <span class="card-icon">🗑️</span>
                    <span class="card-title">Delete Product</span>
                </div>
                <div class="card-btn" onclick="openSection('editTab')">
                    <span class="card-icon">✏️</span>
                    <span class="card-title">Edit Product</span>
                </div>
                <div class="card-btn" onclick="openSection('designTab')">
                    <span class="card-icon">🎨</span>
                    <span class="card-title">Site Design</span>
                </div>
            </div>
        </div>

        <!-- Add Product -->
        <div class="box hidden" id="addTab">
            <button class="back-home" onclick="goHome()">← Back to Home</button>
            <h2>Add Product</h2>
            <form onsubmit="saveProduct(event)">
                <label>Product Title</label>
                <input type="text" id="pTitle" required placeholder="Ex: Minimalist Lamp">

                <label>Image Link (URL)</label>
                <input type="url" id="pImage" required placeholder="https://...">

                <label>Price ($)</label>
                <input type="text" id="pPrice" required placeholder="16.99">

                <label>Old Price ($ - Optional)</label>
                <input type="text" id="pOldPrice" placeholder="19.99">

                <label>Badge (Optional - Auto calculated if empty)</label>
                <input type="text" id="pBadge" placeholder="Leave empty for auto % off">

                <label>Buy Now Link (URL)</label>
                <input type="url" id="pLink" required placeholder="https://amzn.to/...">

                <button type="submit" id="pubBtn">Publish Product</button>
            </form>
        </div>

        <!-- Delete Product -->
        <div class="box hidden" id="deleteTab">
            <button class="back-home" onclick="goHome()">← Back to Home</button>
            <h2>Delete Products</h2>
            <input type="text" id="deleteSearch" placeholder="Search to delete..." onkeyup="loadDeleteList()" style="margin-bottom: 12px;">
            <div id="deleteListContainer" style="max-height: 280px; overflow-y: auto;">Loading...</div>
        </div>

        <!-- Edit Product -->
        <div class="box hidden" id="editTab">
            <button class="back-home" onclick="goHome()">← Back to Home</button>
            <h2>Edit Products</h2>
            <div id="editSelectScreen">
                <input type="text" id="editSearch" placeholder="Search product to edit..." onkeyup="loadEditList()" style="margin-bottom: 12px;">
                <div id="editListContainer" style="max-height: 280px; overflow-y: auto;">Loading...</div>
            </div>

            <form id="actualEditForm" class="hidden" onsubmit="updateProductData(event)">
                <input type="hidden" id="editIndex">
                <label>Product Title</label>
                <input type="text" id="eTitle" required>

                <label>Image Link (URL)</label>
                <input type="url" id="eImage" required>

                <label>Price ($)</label>
                <input type="text" id="ePrice" required>

                <label>Old Price ($)</label>
                <input type="text" id="eOldPrice">

                <label>Badge</label>
                <input type="text" id="eBadge">

                <label>Buy Now Link (URL)</label>
                <input type="url" id="eLink" required>

                <button type="submit" id="updBtn">Update Product</button>
                <button type="button" onclick="cancelEditSelection()" style="background:#333; color:#fff; margin-top:10px;">Back to List</button>
            </form>
        </div>

        <!-- Site Design -->
        <div class="box hidden" id="designTab">
            <button class="back-home" onclick="goHome()">← Back to Home</button>
            <h2>Site Design & Tools</h2>
            <label>Announcement Bar Text</label>
            <input type="text" id="siteAnnounce" placeholder="Ex: 🎁 3% OFF Special Offer">

            <button type="button" onclick="saveSiteSettings()">Save Site Settings</button>
        </div>
    </div>

    <script>
        const BIN_ID = "6a6e4aa0f5f4af5e29df04ca";
        const API_KEY = "$2a$10$ABIpFvmpyDQgEYEVLsfB0OuOHN/XlDvO1p5sETK3GcEMyBWXwp";
        let cloudProducts = [];

        function handleLogin(event) {
            event.preventDefault();
            let u = document.getElementById('adminUser').value.trim();
            let p = document.getElementById('adminPass').value.trim();

            if (u.toLowerCase() === "pasindu chamod munasinha" && p === "20080620Sl") {
                document.getElementById('loginBox').classList.add('hidden');
                document.getElementById('homePage').classList.remove('hidden');
                fetchCloudData();
            } else {
                document.getElementById('errorMsg').innerText = "Incorrect Name or Password!";
            }
        }

        function openSection(sectionId) {
            document.querySelectorAll('.box:not(#loginBox)').forEach(b => b.classList.add('hidden'));
            document.getElementById(sectionId).classList.remove('hidden');
            if(sectionId === 'deleteTab') loadDeleteList();
            if(sectionId === 'editTab') { cancelEditSelection(); loadEditList(); }
        }

        function goHome() {
            document.querySelectorAll('.box:not(#loginBox)').forEach(b => b.classList.add('hidden'));
            document.getElementById('homePage').classList.remove('hidden');
        }

        async function fetchCloudData() {
            try {
                let res = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest`;
                let response = await fetch(res, {
                    headers: { 'X-Master-Key': API_KEY }
                });
                let data = await response.json();
                cloudProducts = data.record || [];
            } catch (e) {
                console.error("Fetch error:", e);
            }
        }

        async function updateCloudData(newProducts, successMsg) {
            try {
                let res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ record: newProducts })
                });
                if (res.ok) {
                    cloudProducts = newProducts;
                    alert(successMsg);
                } else {
                    alert('Error saving data!');
                }
            } catch (e) {
                alert('Network error!');
            }
        }

        async function saveProduct(event) {
            event.preventDefault();
            let title = document.getElementById('pTitle').value.toLowerCase();
            let category = "desk";
            if (title.includes('lamp') || title.includes('light') || title.includes('projector') || title.includes('led')) {
                category = "lighting";
            } else if (title.includes('organizer') || title.includes('shelf') || title.includes('box') || title.includes('bamboo')) {
                category = "organization";
            }

            let priceVal = parseFloat(document.getElementById('pPrice').value);
            let oldPriceVal = parseFloat(document.getElementById('pOldPrice').value);
            let badgeInput = document.getElementById('pBadge').value.trim();
            let badge = badgeInput;

            if (!badge && !isNaN(oldPriceVal) && oldPriceVal > priceVal) {
                let discount = Math.round(((oldPriceVal - priceVal) / oldPriceVal) * 100);
                badge = "-" + discount + "%";
            }

            let newProduct = {
                title: document.getElementById('pTitle').value,
                category: category,
                image: document.getElementById('pImage').value,
                price: document.getElementById('pPrice').value,
                oldPrice: document.getElementById('pOldPrice').value,
                badge: badge,
                link: document.getElementById('pLink').value
            };

            await fetchCloudData();
            cloudProducts.push(newProduct);
            await updateCloudData(cloudProducts, 'Product Successfully Published to Cloud!');
            event.target.reset();
        }

        async function loadDeleteList() {
            await fetchCloudData();
            let container = document.getElementById('deleteListContainer');
            let query = document.getElementById('deleteSearch').value.toLowerCase();

            if (cloudProducts.length === 0) {
                container.innerHTML = '<p style="font-size: 11px; color: #777; text-align:center;">No products found.</p>';
                return;
            }

            let filtered = cloudProducts.map((p, idx) => ({...p, originalIndex: idx}))
                                       .filter(p => p.title.toLowerCase().includes(query));

            let html = '';
            filtered.forEach(prod => {
                html += `
                    <div class="product-item">
                        <span class="product-title">${prod.title}</span>
                        <button class="delete-btn" onclick="deleteProduct(${prod.originalIndex})">Delete</button>
                    </div>
                `;
            });
            container.innerHTML = html || '<p style="font-size: 11px; color: #777; text-align:center;">No matching products.</p>';
        }

        async function deleteProduct(index) {
            if (confirm('Are you sure you want to delete this product?')) {
                await fetchCloudData();
                cloudProducts.splice(index, 1);
                await updateCloudData(cloudProducts, 'Product deleted successfully!');
                loadDeleteList();
            }
        }

        async function loadEditList() {
            await fetchCloudData();
            let container = document.getElementById('editListContainer');
            let query = document.getElementById('editSearch').value.toLowerCase();

            if (cloudProducts.length === 0) {
                container.innerHTML = '<p style="font-size: 11px; color: #777; text-align:center;">No products found.</p>';
                return;
            }

            let filtered = cloudProducts.map((p, idx) => ({...p, originalIndex: idx}))
                                       .filter(p => p.title.toLowerCase().includes(query));

            let html = '';
            filtered.forEach(prod => {
                html += `
                    <div class="product-item">
                        <span class="product-title">${prod.title}</span>
                        <button class="edit-btn" onclick="selectProductForEdit(${prod.originalIndex})">Edit</button>
                    </div>
                `;
            });
            container.innerHTML = html || '<p style="font-size: 11px; color: #777; text-align:center;">No matching products.</p>';
        }

        function selectProductForEdit(index) {
            let prod = cloudProducts[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('eTitle').value = prod.title;
            document.getElementById('eImage').value = prod.image;
            document.getElementById('ePrice').value = prod.price;
            document.getElementById('eOldPrice').value = prod.oldPrice || '';
            document.getElementById('eBadge').value = prod.badge || '';
            document.getElementById('eLink').value = prod.link;

            document.getElementById('editSelectScreen').classList.add('hidden');
            document.getElementById('actualEditForm').classList.remove('hidden');
        }

        function cancelEditSelection() {
            document.getElementById('editSelectScreen').classList.remove('hidden');
            document.getElementById('actualEditForm').classList.add('hidden');
        }

        async function updateProductData(event) {
            event.preventDefault();
            let index = parseInt(document.getElementById('editIndex').value);
            let title = document.getElementById('eTitle').value.toLowerCase();
            let category = "desk";
            if (title.includes('lamp') || title.includes('light') || title.includes('projector') || title.includes('led')) {
                category = "lighting";
            } else if (title.includes('organizer') || title.includes('shelf') || title.includes('box') || title.includes('bamboo')) {
                category = "organization";
            }

            let priceVal = parseFloat(document.getElementById('ePrice').value);
            let oldPriceVal = parseFloat(document.getElementById('eOldPrice').value);
            let badgeInput = document.getElementById('eBadge').value.trim();
            let badge = badgeInput;

            if (!badge && !isNaN(oldPriceVal) && oldPriceVal > priceVal) {
                let discount = Math.round(((oldPriceVal - priceVal) / oldPriceVal) * 100);
                badge = "-" + discount + "%";
            }

            await fetchCloudData();
            cloudProducts[index] = {
                title: document.getElementById('eTitle').value,
                category: category,
                image: document.getElementById('eImage').value,
                price: document.getElementById('ePrice').value,
                oldPrice: document.getElementById('eOldPrice').value,
                badge: badge,
                link: document.getElementById('eLink').value
            };

            await updateCloudData(cloudProducts, 'Product Updated Successfully!');
            cancelEditSelection();
            loadEditList();
        }

        function saveSiteSettings() {
            let announceText = document.getElementById('siteAnnounce').value;
            // නිවැරදි කර ඇත: Shop එකේ loadSettings() එක සමඟ సరిപැළපෙන පරිදි JSON object එකක් ලෙස save කිරීම
            let settings = { announce: announceText };
            localStorage.setItem('zoxara_site_settings', JSON.stringify(settings));
            alert('Site Settings Saved!');
        }
    </script>
</body>
          </html>
